<!doctype html>
<html>
  <head>
    <title>Rock paper scissors</title>

    <link rel="stylesheet" href="/styles/09-rock-paper-scissor(auto-play).css">
    
  </head>
  <body>
    <p class="title">Rock Paper Scissors</p>
    <button class="move-button js-rock-button">
    <img class="move-icon" src="/icons/rock-emoji.png">
  </button>

    <button class="move-button js-paper-button">
    <img class="move-icon" src="/icons/paper-emoji.png">
  </button>

    <button class="move-button js-scissor-button">
    <img class="move-icon" src="/icons/scissors-emoji.png">
  </button>

    <p class="js-result result"></p>
    <p class="js-moves">
    </p>
    <p class="js-score score"></p>

    <button
      onclick="
        score.wins = 0;
        score.ties = 0;
        score.losses = 0;
        localStorage.removeItem('score');
        updateScoreElement();
      "
      class="reset-score-button">
      Reset Score
    </button>

    <button class="auto-play-button" onclick="autoPlay();">
      Auto Play
    </button>

    <script src="/scripts/09-rock-paper-scissor(auto-play).js"></script>
  </body>
</html>
