<!doctype html>
<html>
  <head>
    <title>Calculator</title>

    <link rel="stylesheet" href="/styles/07-calculator.css">

  </head>
  <body>
    <p class="title">Calculator</p>

    <p class="js-output output"></p>

    <p>
      <button onclick="
        updateCalculation('1')
        showOutput();
        ">1</button>

      <button onclick="
      updateCalculation('2')
      showOutput();
      ">2</button>

      <button onclick="
      updateCalculation('3')
      showOutput();
      ">3</button>

      <button onclick="
      updateCalculation('+')
      showOutput();
      " class="operation">+</button>
    </p>

    <p>
      <button onclick="
      updateCalculation('4')
      showOutput();
      ">4</button>

      <button onclick="
      updateCalculation('5')
      showOutput();
      ">5</button>

      <button onclick="
      updateCalculation('6')
      showOutput();
      ">6</button>

      <button onclick="
      updateCalculation('-')
      showOutput();
      " class="operation">-</button>
    </p>

    <p>
      <button onclick="
        updateCalculation('7')
        showOutput();
        ">7</button>

      <button onclick="
      updateCalculation('8')
      showOutput();
      ">8</button>

      <button onclick="
      updateCalculation('9')
      showOutput();
      ">9</button>

      <button onclick="
      updateCalculation('*')
      showOutput();
      " class="operation">*</button>
    </p>

    <p>
      <button onclick="
        updateCalculation('0')
        showOutput();
        ">0</button>

      <button onclick="
        updateCalculation('.')
        showOutput();
      ">.</button>
      
      <button
        onclick="
          calculation = eval(calculation);
          localStorage.setItem('calculation',calculation);
          showOutput();
        "
      >
        =
      </button>

      <button
        onclick="
          calculation += '/';
          showOutput();
        "
        class="operation">
        /
      </button>
    </p>

    <button
        onclick="
          calculation = '';
          localStorage.setItem('calculation',calculation);
          showOutput();
        "
      >
        clear
      </button>

    <script src="/scripts/07-calculator.js"></script>
  </body>
</html>
