<!doctype html>
<html lang="en">
  <head>
    <title>Variables</title>
  </head>
  <body>
    <script>
      let variable1 = 7;
      console.log(variable1);

      const calculation = 5 + 5;
      console.log(calculation);
      console.log(calculation + 5);

      const result = calculation + 2;
      console.log(result);

      const message = 'hello'
      console.log(message);

      //reassign the variables

      variable1 = 2
      console.log(variable1);

      variable1 = variable1 + 1;
      console.log(variable1);

      // const is another type of varibale container
      // but here the value remain unchange 

      const variable2 = 3;

      var variable3 = 3;

      console.log(typeof 8);
      console.log(typeof message);
    </script>
  </body>
</html>
