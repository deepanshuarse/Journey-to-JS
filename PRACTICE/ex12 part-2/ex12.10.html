<!doctype html>
<html>
  <head>
    <title>loops</title>
  </head>
  <body>
    <script>
      // trick is to check for fizzbuzz first, then fizz, then buzz, then the number
      
      for (let i = 0; i < 21; i++) {
        if (i % 3 === 0 && i % 5 === 0 && i !== 0) {
          console.log('fizzbuzz');
        } else if (i % 3 === 0 && i !== 0) {
          console.log('fizz');
        } else if (i % 5 === 0 && i !== 0) {
          console.log('buzz');
        } else {
          console.log(i);
        }
      }
    </script>
  </body>
</html>
