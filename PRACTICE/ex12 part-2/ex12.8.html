<!doctype html>
<html>
  <head>
    <title>Loop</title>
  </head>
  <body>
    <script>
      function removeEgg (foods) {
        foods.reverse();
        const result = [];
        let eggREmoved = 0;
        for (let i = 0; i < foods.length; i++) {
          if (foods[i] === 'egg' && eggREmoved < 2) {
            eggREmoved ++;
            continue;
          }
          
          result.push(foods[i]);
        }
        result.reverse();
        return result;
      }

      console.log(removeEgg(['egg','apple','egg','egg','ham']));
    </script>
  </body>
</html>
