<!doctype html>
<html>
  <head>
    <title>DOM practice</title>
  </head>
  <body>
    <input type="text" class="js-input" placeholder="Name" onkeydown="handelKeyDownEvent(event)">
    <button onclick="
      returnText();
    ">Submit</button>
    <p class="js-text"></p>
    <script>
      function handelKeyDownEvent (event) {
        if (event.key === 'Enter') {
          returnText();
        }
      }

      function returnText () {
        const inputElement = document.querySelector('.js-input').value;
        document.querySelector('.js-text')
          .innerHTML = `Your name is: ${inputElement}`;
      }
    </script>
  </body>
</html>
