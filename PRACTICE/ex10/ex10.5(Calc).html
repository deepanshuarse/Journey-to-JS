<!doctype html>
<html>
  <head>
    <title>Calculator</title>

    <style>
      .fourth-row,
      .third-row,
      .second-row,
      .first-row {
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <p>Calculator</p>

    <p class="js-output"></p>

    <div class="first-row">
      <button onclick="
        updateCalculation('1')
        showOutput();
        ">1</button>

      <button onclick="
      updateCalculation('2')
      showOutput();
      ">2</button>

      <button onclick="
      updateCalculation('3')
      showOutput();
      ">3</button>

      <button onclick="
      updateCalculation('+')
      showOutput();
      ">+</button>
    </div>

    <div class="second-row">
      <button onclick="
      updateCalculation('4')
      showOutput();
      ">4</button>

      <button onclick="
      updateCalculation('5')
      showOutput();
      ">5</button>

      <button onclick="
      updateCalculation('6')
      showOutput();
      ">6</button>

      <button onclick="
      updateCalculation('-')
      showOutput();
      ">-</button>
    </div>

    <div class="third-row">
      <button onclick="
        updateCalculation('7')
        showOutput();
        ">7</button>

      <button onclick="
      updateCalculation('8')
      showOutput();
      ">8</button>

      <button onclick="
      updateCalculation('9')
      showOutput();
      ">9</button>

      <button onclick="
      updateCalculation('*')
      showOutput();
      ">*</button>
    </div>

    <div class="fourth-row">
      <button onclick="
        updateCalculation('0')
        showOutput();
        ">0</button>

      <button onclick="
        updateCalculation('.')
        showOutput();
      ">.</button>
      
      <button
        onclick="
          calculation = eval(calculation);
          localStorage.setItem('calculation',calculation);
          showOutput();
        "
      >
        =
      </button>

      <button
        onclick="
          calculation += '/';
          showOutput();
        "
      >
        /
      </button>

      <button
        onclick="
          calculation = '';
          localStorage.setItem('calculation',calculation);
          showOutput();
        "
      >
        clr
      </button>
    </div>

    <script>

      let calculation = localStorage.getItem('calculation') || ''; 

      showOutput();

      function updateCalculation(value) {
        calculation += value;
        
        localStorage.setItem('calculation',calculation);
      }

      function showOutput () {
        document.querySelector('.js-output')
          .innerHTML = calculation;

        if (calculation === '') {
          document.querySelector('.js-output')
          .innerHTML = 'clear';
        }
      }

    </script>
  </body>
</html>
