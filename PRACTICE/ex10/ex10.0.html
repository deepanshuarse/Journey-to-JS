<!doctype html>
<html>
  <head>
    <title>DOM practice</title>
  </head>
  <body>
    <button>9a</button>
    <p><button class="js-second-button">9b</button></p>

    <button onclick="
      buttonSelector('heads');
    ">heads</button>

    <button onclick="
      buttonSelector('tails');
    ">tails</button>

    <p class="choice"></p>

    <script>
      /*
      console.log(document.querySelector('button'));
      const nameChange = document.querySelector('.js-second-button').innerHTML = '9b Done';
      console.log(nameChange);
      */

      function buttonSelector (who) {
        if (who === 'heads') {
          document.querySelector('.choice')
            .innerHTML = `You chose: ${who}`;
        } else if (who === 'tails') {
          document.querySelector('.choice')
            .innerHTML = `You chose: ${who}`;
        }
      }
    </script>
  </body>
</html>
