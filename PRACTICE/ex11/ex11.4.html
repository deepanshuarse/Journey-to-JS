<!doctype html>
<html>
  <head>
    <title>DOM Projects (error)</title>
    <style>

      body{
        font-family: Arial, Helvetica, sans-serif;
      }

      .cost-input{
        padding: 10px;
        font-size: 16px;
      }

      .calculate-button{
        padding: 12px 16px;
        border: none;
        background-color: green;
        color: white;
        font-size: 15px;
        cursor: pointer;

      }

      .error {
        color: red;
      }
    </style>
  </head>
  <body>

    
    <p>Amazon Shipping Calculator</p>

    <p>Orders under $40 = +$10 shipping</p>

    <p>Orders over $40 = FREE shipping</p>

    <input type="text" placeholder="Cost of order" class="js-cost-input cost-input" onkeydown="
      handleCostKeydown(event);
    ">

    <button onclick="
      calculateTotal();
    " class="js-calculate-button calculate-button">
      Calculate
    </button>

    <p class="js-total-cost"></p>

    <script>

      function handleCostKeydown (event) {
        if (event.key === 'Enter') {
          calculateTotal();
        }
      }

      function calculateTotal() {
        const inputElement = document.querySelector('.js-cost-input');
        let cost = Number(inputElement.value);
        const text = document.querySelector('.js-total-cost');

        if (cost < 40) {
          if (cost > 0) {
            cost = cost + 10;
            text.classList.remove('error');
            text.innerHTML = `$${cost}`;
          } else if (cost <= 0) {
            text.classList.add('error');
              text.innerHTML = 'Error: cot cannot be less than $0';
          }
        } 
      }
    </script>
  </body>
</html>
