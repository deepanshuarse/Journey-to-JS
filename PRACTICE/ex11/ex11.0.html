<!doctype html>
<html>
  <head>
    <title>HTML CSS JS</title>

    <style>
      button {
        cursor: pointer;
      }

      .add-to-cart-button {
        padding: 8px 34px;
        background-color: rgb(255, 216, 20);
        color: black;
        font-family: Arial, Helvetica, sans-serif;
        border: none;
        border-radius: 18px;
      }

      .request-button,
      .schedule-button {
        padding: 14px 26px;
        border: none;
        border-radius: 8px;
        font-weight: 600;
      }

      .request-button {
        background-color: black;
        color: white;
        margin-right: 16px;
      }

      .schedule-button {
        background-color: rgb(230, 230, 230);
      }
    </style>
  </head>
  <body>
    <button class="add-to-cart-button">Add to Cart</button>

    <p>
      <button class="request-button">Request now</button>
      <button class="schedule-button">Schedule for later</button>
    </p>

    <p><button class="js-button">Test</button></p>

    <script>

        const testButton = document
  .querySelector(".js-button")
  .classList.contains("js-button");

console.log(testButton);

      
    </script>
  </body>
</html>
