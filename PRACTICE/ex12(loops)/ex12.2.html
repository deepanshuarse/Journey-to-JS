<!DOCTYPE html>
<html>
<head>
  <title>Loop</title>
</head>
<body>
  <script>
    let array = [1,2,3,4,5];

    for (let i = 0; i < array.length ; i ++) {
      array[i] = array[i] + 1;
    }

    console.log(array);

    function addOne (array) {
      let result = []
      for (let i = 0; i < array.length; i ++) {
        result.push(array[i] + 1);
      }
      return result;
    }

    console.log(addOne([1,2,9]));

    // another way
    function addOne (array) {
      for (let i = 0; i < array.length; i ++) {
        array[i] = array[i] + 1;
      }
      return array;
    }

    console.log(addOne([-2,-1,0,99]));
    
  </script>
</body>
</html>
