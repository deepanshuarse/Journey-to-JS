<!DOCTYPE html>
<html lang="en">
<head>
  <title>Loop</title>
</head>
<body>
  <script>
    let i = 0
    while (i <= 5) {
      let nums = i * 2;
      let multiply = nums * nums;
      i ++;
      console.log(`2 X ${nums} = ${multiply}`);
    }

    for (let i = 5; i >= 0; i --) {
      console.log(i);
    }
  </script>
</body>
</html>
